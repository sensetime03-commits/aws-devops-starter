
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWS DevOps Starter</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .badge {
            display: inline-block;
            background: #2563eb;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 17px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .card h2 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            margin-bottom: 12px;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .notes {
            margin-top: 15px;
        }

        .note {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .delete {
            width: auto;
            padding: 6px 10px;
            background: #dc2626;
            margin-left: 10px;
        }

        .delete:hover {
            background: #b91c1c;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div class="badge">AWS DEVOPS PROJECT</div>

        <h1>DevOps Starter</h1>

        <p class="subtitle">
            Flask • Docker • GitHub Actions • AWS
        </p>
    </header>

    <div class="grid">

        <!-- Health -->
        <div class="card">
            <h2>Application Status</h2>

            <div class="status">
                <span class="dot"></span>
                <span id="healthStatus">Checking...</span>
            </div>
        </div>

        <!-- Add Note -->
        <div class="card">
            <h2>Add a Note</h2>

            <input
                type="text"
                id="noteInput"
                placeholder="Enter your note..."
            >

            <button onclick="addNote()">
                Add Note
            </button>
        </div>

    </div>

    <!-- Notes -->
    <div class="card" style="margin-top:20px;">

        <h2>
            Notes
            (<span id="noteCount">0</span>)
        </h2>

        <div id="notes" class="notes">
            Loading notes...
        </div>

    </div>

    <footer>
        AWS DevOps Starter • Flask Application
    </footer>

</div>


<script>

async function checkHealth() {

    try {

        const response = await fetch("/health");

        if (response.ok) {
            document.getElementById("healthStatus").textContent =
                "Application is healthy";
        } else {
            document.getElementById("healthStatus").textContent =
                "Application error";
        }

    } catch (error) {

        document.getElementById("healthStatus").textContent =
            "Application offline";
    }
}


async function loadNotes() {

    try {

        const response = await fetch("/notes");

        const notes = await response.json();

        const container = document.getElementById("notes");

        document.getElementById("noteCount").textContent =
            notes.length;

        if (notes.length === 0) {

            container.innerHTML =
                "<p style='color:#64748b'>No notes yet.</p>";

            return;
        }

        container.innerHTML = "";

        notes.forEach(note => {

            const div = document.createElement("div");

            div.className = "note";

            div.innerHTML = `
                <span>${escapeHtml(note.text)}</span>

                <button
                    class="delete"
                    onclick="deleteNote(${note.id})">
                    Delete
                </button>
            `;

            container.appendChild(div);
        });

    } catch (error) {

        document.getElementById("notes").innerHTML =
            "<p style='color:#ef4444'>Failed to load notes.</p>";
    }
}


async function addNote() {

    const input = document.getElementById("noteInput");

    const text = input.value.trim();

    if (!text) {
        alert("Please enter a note.");
        return;
    }

    const response = await fetch("/notes", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            text: text
        })
    });

    if (response.ok) {

        input.value = "";

        loadNotes();

    } else {

        alert("Failed to add note.");
    }
}


async function deleteNote(id) {

    const response = await fetch(`/notes/${id}`, {

        method: "DELETE"
    });

    if (response.ok) {

        loadNotes();

    } else {

        alert("Failed to delete note.");
    }
}


function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


checkHealth();

loadNotes();

</script>

</body>
</html>
```
